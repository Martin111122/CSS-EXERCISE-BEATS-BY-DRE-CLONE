<!DOCTYPE html>
<html>
    <head>
        <title>Beats</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav class="navbar">
            <a class="brand">
                <img src="./assets/logo.png" alt="Beats Logo">
            </a>

            <div class="nav-links">
                <a>Shop</a>
                <a class="gift-link">Gift Guide <span aria-hidden="true">▱</span></a>
                <a>Support</a>
            </div>

            <div class="nav-actions">
                <button type="button">
                    <img src="./assets/search.png" alt="search button">
                </button>
                <button type="button">
                    <img src="./assets/bag.png" alt="shopping bag button">
                </button>
            </div>
        </nav>

        <main>
            <section class="hero">
                <img class="hero-image" src="./assets/image15.jpg" alt="Kendall Jenner wearing Beats 360 headphones">
                <div class="hero-content">
                    <p class="hero-kicker">Kendall Jenner</p>
                    <h1>Beats 360</h1>
                    <p class="hero-description">One headphone. Every version of you.</p>
                    <div class="hero-actions">
                        <a class="hero-button hero-button-primary" href="#">Shop Now</a>
                        <a class="hero-button hero-button-secondary" href="#">Customize <span class="paint-icon" aria-hidden="true">♧</span></a>
                    </div>
                </div>
            </section>

            <section class="favorites">
                <h2>Kendall's Favorites</h2>
                <div class="product-grid">
                    <article class="product-card">
                        <p class="product-label">New</p>
                        <h3>Beats 360</h3>
                        <p class="product-price">$349.99</p>
                        <img src="./assets/image4.jpg" alt="White Beats 360 headphones">
                        <div class="swatches" aria-label="Available colors">
                            <span class="swatch swatch-dark selected"></span>
                            <span class="swatch swatch-white"></span>
                            <span class="swatch swatch-pink"></span>
                            <span class="swatch swatch-sand"></span>
                        </div>
                    </article>

                    <article class="product-card">
                        <p class="product-label">New</p>
                        <h3>Beats 360 Cushion Kit - Performance Knit</h3>
                        <p class="product-price">$49.99</p>
                        <img src="./assets/image5.jpg" alt="Pink Beats 360 cushion kit">
                        <div class="swatches" aria-label="Available colors">
                            <span class="swatch swatch-dark selected"></span>
                            <span class="swatch swatch-pink"></span>
                            <span class="swatch swatch-sand"></span>
                            <span class="swatch swatch-lime"></span>
                            <span class="swatch swatch-navy"></span>
                        </div>
                    </article>

                    <article class="product-card">
                        <p class="product-label">New</p>
                        <h3>Beats 360 Cushion Kit - Performance Knit</h3>
                        <p class="product-price">$49.99</p>
                        <img src="./assets/image6.jpg" alt="Blue Beats 360 cushion kit">
                        <div class="swatches" aria-label="Available colors">
                            <span class="swatch swatch-dark selected"></span>
                            <span class="swatch swatch-pink"></span>
                            <span class="swatch swatch-lime"></span>
                            <span class="swatch swatch-blue"></span>
                            <span class="swatch swatch-navy"></span>
                        </div>
                    </article>
                </div>
            </section>
        </main>
    </body>
</html>
